<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · OSI Inventory</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body><script type="module">import{shell,setApp,toast,supabase,esc}from"./js/app.js";const p=await shell("Settings");if(p)setApp(`<div class="max-w-2xl"><div class="mb-5"><h1 class="text-3xl font-black">Settings</h1><p class="text-sm text-slate-500">Application preferences and account security.</p></div><div class="card p-6"><h2 class="font-black">Session</h2><p class="text-sm text-slate-500 mt-1">You are signed in as ${esc(p.email||"")}</p><button id="signout" class="btn btn-secondary mt-4">Sign out</button></div></div>`);document.querySelector("#signout")?.addEventListener("click",async()=>{await supabase.auth.signOut();location.href="index.html"});</script></body></html>
